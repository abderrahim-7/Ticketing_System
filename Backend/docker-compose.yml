

version : '3.8'

services: 
  backend: 
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - TicketingNetwork
    ports: 
      - 8080:8080
    container_name : backend

    env_file:
      - .env

    depends_on: 
      mysql:
        condition: service_healthy 
      redis: 
        condition: service_started

  mysql:
    image : mysql
    env_file:
      - .env
    volumes:
      - TicketingData:/var/lib/mysql
    ports : 
      - 3307:3306
    networks :
      - TicketingNetwork

    environment:
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: root



    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  redis: 
    image: redis

    env_file:
      - .env
    
    ports: 
      - ${REDIS_PORT}:6379
    networks: 
      - TicketingNetwork

volumes : 
  TicketingData :
      driver : local

networks:
  TicketingNetwork :
       driver : bridge
